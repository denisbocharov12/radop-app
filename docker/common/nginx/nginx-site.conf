server {
    listen 80;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location /storage/avatar {
        try_files $uri /storage/avatar/default.jpg =404;
        expires 180s;
    }

    # Сборка и медиатека: имя файла меняется вместе с содержимым (хеш у сборки,
    # идентификатор записи у медиатеки), поэтому держим год и не перепроверяем
    # даже при обновлении страницы — immutable снимает условные запросы.
    # Сюда же попадают уменьшенные копии фотографий, которые карточка товара
    # подгружает при наведении: второй раз они берутся из кеша браузера.
    location ~* ^/(build|media)/.+\.(js|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Остальная статика: месяц с обычной перепроверкой. Имена там повторяются
    # (например, /cert/<код>.jpg при замене фотографии товара), и вечный кеш
    # показывал бы старый снимок.
    location ~* \.(js|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

#    location /api/v1/support {
#        proxy_pass             http://gt:8080/api;
#        proxy_read_timeout     60;
#        proxy_connect_timeout  60;
#        proxy_redirect         off;
#        proxy_buffering off;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-Host $host;
#        proxy_set_header X-Forwarded-Port $server_port;
#    }

    location ~ \.php$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Keep-Alive, User-Agent, Cache-Control, Content-Type, x-localization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        if ($request_method ~* "(GET|POST)") {
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Keep-Alive, User-Agent, Cache-Control, Content-Type, x-localization' always;
        }

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_keep_conn on;
    }

    location ~ /\.ht {
        deny all;
    }
}
