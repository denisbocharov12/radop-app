name: GitHub Pages

# Витрина выкладывается статикой: workflow поднимает Laravel на срезе базы,
# обходит его по списку публичных адресов и публикует готовый HTML.
#
# Запускается только с ветки pages — в master и в рабочую ветку ничего не
# сливается.

on:
  push:
    branches: [pages]
  workflow_dispatch:
    inputs:
      products:
        description: 'Не используется: состав демонстрации задаётся срезом базы'
        default: '400'
        required: false

# Статика уезжает в ветку gh-pages, поэтому нужна запись в репозиторий
permissions:
  contents: write

# Параллельные выкладки не нужны, но начатую не обрываем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка статики
    runs-on: ubuntu-latest

    env:
      SITE_ORIGIN: ${{ format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ github.event.repository.name }}
      # Фотографии товаров в репозитории не хранятся — берём их с боевого сайта
      MEDIA_ORIGIN: https://radop.md
      MAX_PRODUCTS: ${{ github.event.inputs.products || '400' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: radop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, intl, zip, pdo_mysql, exif
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Окружение
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            # Подкаталог в APP_URL Laravel отрезает от пути запроса и перестаёт
            # находить маршруты — его дописывает статический экспорт
            echo "APP_URL=${SITE_ORIGIN}"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=radop"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=secret"
            echo "CACHE_DRIVER=file"
            echo "SESSION_DRIVER=file"
            echo "QUEUE_CONNECTION=sync"
          } >> .env
          php artisan key:generate

      - name: База из среза
        run: |
          php artisan migrate --force
          # Заливаем своей командой: консольного клиента mysql на раннере
          # может не оказаться, а дамп у нас простой.
          php artisan db:import-dump database/pages/dataset.sql.gz

      - name: Сборка фронтенда
        run: npm run build

      - name: Запуск приложения
        run: |
          php artisan optimize:clear
          php artisan serve --host=127.0.0.1 --port=8000 &
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:8000/"; then
              exit 0
            fi
            sleep 2
          done
          echo "Приложение не поднялось"
          exit 1

      - name: Статический экспорт
        run: |
          node tools/static-export.mjs \
            --origin=http://127.0.0.1:8000 \
            --base="${BASE_PATH}" \
            --site="${SITE_ORIGIN}" \
            --media="${MEDIA_ORIGIN}" \
            --out=dist \
            --urls="--all"

      # Готовую статику кладём в ветку gh-pages: именно её отдаёт Pages
      # в режиме «Deploy from a branch». Историю не копим — каждый выкат
      # перезаписывает ветку целиком.
      - name: Публикация в ветку gh-pages
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Витрина: статика от $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Копия выгрузки остаётся в артефактах — удобно смотреть, что уехало
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
